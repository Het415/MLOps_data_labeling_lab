name: Notebooks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  run-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        # The CPU-only torch wheel skips several GB of CUDA libraries
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt nbconvert ipykernel

      - name: Execute notebooks
        run: |
          for nb in 01_sms_spam_labeling_functions.ipynb 02_sms_spam_data_augmentation.ipynb 03_sms_spam_data_slicing.ipynb; do
            jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=1800 --output-dir executed "$nb"
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/

      - name: Add metrics to job summary
        run: |
          echo "## results/metrics.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat results/metrics.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
